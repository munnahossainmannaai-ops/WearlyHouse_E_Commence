<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Wearly House — a future-wear & hardware atelier. Apparel-adjacent tech, haptic couture and orbital freight, engineered beyond spec since 2049." />
    <meta name="theme-color" content="#07070d" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 28 9v14L16 30 4 23V9z' fill='none' stroke='%232de2ff' stroke-width='2.4'/%3E%3Cpath d='M8.5 12l3 9.5L16 14l4.5 7.5 3-9.5' fill='none' stroke='%23a06bff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Wearly House — Wear the Near Future</title>
    <style>
      html, body { margin: 0; background-color: #07070d; }
      html[data-theme="cleanroom"], html[data-theme="cleanroom"] body { background-color: #edf0f6; }
    </style>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem("wearly-house-v1") || "null");
        if (s && s.state && s.state.theme === "cleanroom") {
          document.documentElement.setAttribute("data-theme", "cleanroom");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
